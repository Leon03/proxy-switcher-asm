name: Build Proxy Switcher

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: build.bat

      - name: Verify output
        shell: powershell
        run: |
          if (Test-Path build\ProxySwitcher.exe) {
            $size = (Get-Item build\ProxySwitcher.exe).Length
            Write-Host "Build OK: $size bytes"
          } else {
            Write-Error "ProxySwitcher.exe not found"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxySwitcher-windows
          path: build\ProxySwitcher.exe

      - name: Create release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: build\ProxySwitcher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK3 dev
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build
        run: |
          mkdir -p build
          gcc -O2 -o build/proxy_switcher_linux proxy_switcher_linux.c $(pkg-config --cflags --libs gtk+-3.0)

      - name: Verify output
        run: |
          ls -la build/proxy_switcher_linux
          file build/proxy_switcher_linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxySwitcher-linux
          path: build/proxy_switcher_linux

      - name: Create release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: build/proxy_switcher_linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}